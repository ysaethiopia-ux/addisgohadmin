<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YSA-EX Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Archivo+Black&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="bg-shape bg-shape-a"></div>
    <div class="bg-shape bg-shape-b"></div>

    <main class="layout">
      <aside class="sidebar">
        <p class="eyebrow">YSA-EX</p>
        <h1>Admin</h1>
        <p class="subtitle">Choose a table to view live data from Neon.</p>

        <div class="sidebar-auth" id="sidebarAuth">
          <div class="auth-status-indicator">
            <span class="status-dot"></span>
            <span id="authStatusText">Admin Active</span>
          </div>
          <button id="logoutBtn" class="logout-btn" type="button" title="Log out of admin session">Logout</button>
        </div>

        <nav class="side-nav" aria-label="Admin tables">
          <button class="nav-item is-active" type="button" data-key="funnelLead">
            <span>FunnelLead</span>
            <strong id="leadCount">0</strong>
          </button>
          <button class="nav-item" type="button" data-key="upgradeTransaction">
            <span>UpgradeTransaction</span>
            <strong id="transactionCount">0</strong>
          </button>
          <button class="nav-item" type="button" data-key="marketingAnalytics">
            <span>Lead Tracking</span>
            <strong id="analyticsCount">Live</strong>
          </button>
        </nav>

        <button id="refreshBtn" class="refresh-btn" type="button">Refresh Data</button>
      </aside>

      <section class="content">
        <!-- Date Range Filter Bar (Visible only when Lead Tracking is selected) -->
        <section class="analytics-filter-bar" id="analyticsFilterBar" hidden>
          <div class="filter-presets">
            <button type="button" class="preset-btn is-active" data-preset="all">All Time</button>
            <button type="button" class="preset-btn" data-preset="today">Today</button>
            <button type="button" class="preset-btn" data-preset="yesterday">Yesterday</button>
            <button type="button" class="preset-btn" data-preset="7d">Last 7 Days</button>
            <button type="button" class="preset-btn" data-preset="30d">Last 30 Days</button>
          </div>
          <form class="filter-custom" id="customDateForm">
            <div class="date-field">
              <label for="startDateInput">From</label>
              <input type="date" id="startDateInput" />
            </div>
            <div class="date-field">
              <label for="endDateInput">To</label>
              <input type="date" id="endDateInput" />
            </div>
            <button type="submit" class="filter-apply-btn">Apply</button>
          </form>
          <div class="timezone-badge" id="timezoneBadge">Timezone: UTC</div>
        </section>

        <section class="cards" id="cards"></section>

        <section class="panel">
          <div class="panel-header">
            <h2 id="activeTitle">FunnelLead</h2>
            <span id="activeCount" class="pill">0 rows</span>
          </div>

          <!-- Lead Tracking / Marketing Analytics View -->
          <div id="marketingAnalyticsWrap" class="analytics-wrap" hidden></div>

          <!-- Raw Table View (active for FunnelLead, FunnelEvent, UpgradeTransaction) -->
          <div class="table-wrap" id="activeTableWrap"></div>
        </section>
      </section>
    </main>

    <template id="emptyTemplate">
      <div class="empty">No records found.</div>
    </template>

    <!-- Admin Authentication Modal -->
    <div id="authModal" class="auth-modal" hidden>
      <div class="auth-modal__backdrop"></div>
      <div class="auth-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="authTitle">
        <span class="auth-modal__badge">Protected Area</span>
        <h2 id="authTitle">Admin Authentication</h2>
        <p class="auth-modal__desc">Please enter the admin passcode to access this dashboard.</p>
        <form id="authForm" class="auth-form">
          <div class="form-group">
            <label for="adminPasscodeInput">Admin Passcode</label>
            <input
              type="password"
              id="adminPasscodeInput"
              class="auth-input"
              placeholder="Enter passcode"
              autocomplete="current-password"
              required
            />
          </div>
          <p id="authErrorMsg" class="auth-error" hidden></p>
          <button type="submit" id="authSubmitBtn" class="auth-submit-btn">Unlock Dashboard</button>
        </form>
      </div>
    </div>

    <script src="./app.js" defer></script>
  </body>
</html>
